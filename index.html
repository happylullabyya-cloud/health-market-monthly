<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>健康・飲控・茶類市場監測儀表板</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#f5f4ed;--surface:#fff;--text:#173a32;--muted:#688078;--line:#dbe7e1;--green:#357d68;--green2:#87bda7;--yellow:#e7b965;--berry:#c96d69;--shadow:0 10px 28px rgba(24,57,48,.08)}
body.dark{--bg:#14221e;--surface:#20332d;--text:#eef7f2;--muted:#b9cec4;--line:#385249;--green:#69b695;--green2:#386b58;--yellow:#edc56f;--berry:#e58b86;--shadow:none}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC",Arial,sans-serif}.wrap{max-width:1440px;margin:auto;padding:25px}.header{display:flex;justify-content:space-between;align-items:flex-start;gap:18px}.eyebrow{font-size:13px;color:var(--green);font-weight:700;letter-spacing:.08em}.header h1{margin:7px 0;font-size:30px}.meta{color:var(--muted);font-size:14px;line-height:1.7}.actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}.search,button,select{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit}.search{width:235px}button{cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:23px 0 17px}.tab{background:transparent}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}.card{padding:18px}.card .label{color:var(--muted);font-size:14px}.card .value{font-size:30px;font-weight:800;margin-top:5px}.card .sub{font-size:12px;color:var(--muted);margin-top:4px}.grid{display:grid;grid-template-columns:1.12fr .88fr;gap:16px;margin-top:16px}.panel{padding:18px;overflow:auto}.panel h2{font-size:18px;margin:0 0 14px}.notice{border-left:4px solid var(--yellow);background:color-mix(in srgb,var(--yellow) 14%,transparent);padding:13px 15px;border-radius:8px;line-height:1.65}.hidden{display:none}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:11px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{white-space:nowrap;cursor:pointer;position:sticky;top:0;background:var(--surface)}a{color:var(--green);font-weight:650;text-decoration:none}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}.high{background:#f9d7d5;color:#8b3330}.medium{background:#faedc9;color:#735000}.low{background:#dfeee7;color:#27614d}.confirmed{background:#dcefe7;color:#28624e}.pending{background:#f9eccd;color:#795800}.noise{background:#e7e9e8;color:#53605c}.sort{font-size:11px;color:var(--muted);margin-left:4px}.empty{color:var(--muted);padding:24px;text-align:center}.footer{margin:20px 0 8px;color:var(--muted);font-size:13px;line-height:1.65}.risk-high{color:#a13935;font-weight:700}.risk-medium{color:#8a6200;font-weight:700}.risk-low{color:#2c7157;font-weight:700}@media(max-width:850px){.header{flex-direction:column}.actions{justify-content:flex-start}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.search{width:100%}}@media(max-width:480px){.cards{grid-template-columns:1fr}.wrap{padding:16px}.header h1{font-size:25px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="header">
    <div>
      <div class="eyebrow">HEALTH · WEIGHT MANAGEMENT · TEA</div>
      <h1 id="report-title">健康・飲控・茶類市場監測儀表板</h1>
      <div class="meta"><span id="report-period">載入中…</span>　｜　最後更新：<span id="report-updated">載入中…</span></div>
    </div>
    <div class="actions"><input class="search" id="search" placeholder="搜尋全站資料…"><button id="theme">深／淺色模式</button></div>
  </header>
  <nav id="tabs" class="tabs"></nav>
  <main id="app"><div class="panel">正在讀取 <code>data/signals.json</code>…</div></main>
  <footer class="footer" id="footer">本報告僅使用公開可驗證資料；社群訊號反映公開討論熱度，不代表因果關係、全體消費者行為或市場規模。</footer>
</div>
<script>
const TABS={overview:'市場總覽',ingredients:'功能性成分',benefits:'健康益處',regulations:'監管動態',new_products:'新品發布',social_trends:'社群趨勢',research_reports:'研究報告',opportunities:'機會缺口'};
let signals={},active='overview',sortState={};let barChart,donutChart,lineChart;
const esc=v=>String(v??'未查得').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:[];
function badge(v){let x=String(v||'未查得').toLowerCase();let cls=x.includes('high')||x.includes('高')?'high':x.includes('medium')||x.includes('中')?'medium':x.includes('pending')||x.includes('待')?'pending':x.includes('noise')||x.includes('雜')?'noise':x.includes('confirmed')||x.includes('已確認')?'confirmed':'low';return `<span class="badge ${cls}">${esc(v)}</span>`}
function urls(v){let a=arr(v);return a.length?a.map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">來源${a.length>1?i+1:''}</a>`).join('、'):'未查得'}
function score(v){return Number.isFinite(+v)?Math.round(+v):'—'}
function status(v){const m={rising:'上升',stable:'持平',cooling:'降溫',emerging_pending:'新興待驗證',emerging_confirmed:'已確認新興'};return m[v]||v||'未查得'}
function renderTabs(){document.getElementById('tabs').innerHTML=Object.entries(TABS).map(([k,v])=>`<button class="tab ${active===k?'active':''}" data-tab="${k}">${v}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{active=b.dataset.tab;render()})}
function table(headers,rows,key){if(!rows.length)return '<div class="empty">本期未新增可驗證訊號。</div>';let order=sortState[key]||{col:-1,dir:1};return `<table><thead><tr>${headers.map((h,i)=>`<th data-sort="${key}" data-col="${i}">${esc(h)}<span class="sort">↕</span></th>`).join('')}</tr></thead><tbody>${rows.map(r=>'<tr>'+r.map(c=>`<td>${c}</td>`).join('')+'</tr>').join('')}</tbody></table>`}
function attachSort(){document.querySelectorAll('[data-sort]').forEach(th=>th.onclick=()=>{let k=th.dataset.sort,c=+th.dataset.col;let s=sortState[k]||{col:-1,dir:1};sortState[k]={col:c,dir:s.col===c?-s.dir:1};render()})}
function sortItems(items,key,accessor){let s=sortState[key];if(!s||s.col<0)return items;return [...items].sort((a,b)=>String(accessor(a,s.col)).localeCompare(String(accessor(b,s.col)),undefined,{numeric:true})*s.dir)}
function overview(){const k=signals.kpis||{}, ingredients=arr(signals.ingredients), benefits=arr(signals.benefits), summary=signals.summary||{};return `<section class="cards"><div class="card"><div class="label">監測訊號</div><div class="value">${score(k.total_signals)}</div><div class="sub">本期整合訊號</div></div><div class="card"><div class="label">已確認新興</div><div class="value">${score(k.confirmed_emerging_signals)}</div><div class="sub">符合 3 來源門檻</div></div><div class="card"><div class="label">新品／上架</div><div class="value">${score(k.new_products??k.new_product_events)}</div><div class="sub">本期公開資料</div></div><div class="card"><div class="label">法規／風險</div><div class="value">${score(k.regulatory_events)}</div><div class="sub">需追蹤事件</div></div></section><section class="panel" style="margin-top:16px"><h2>本期重點</h2><div class="notice"><strong>${esc(summary.headline||'本期尚無摘要')}</strong>${summary.week_over_week_assessment?`<br>${esc(summary.week_over_week_assessment)}`:''}<ul>${arr(summary.key_takeaways).slice(0,6).map(x=>`<li>${badge(x.priority)} <strong>${esc(x.title)}</strong>：${esc(x.why_it_matters)}；建議：${esc(x.recommended_action)}（${urls(x.source_urls)}）</li>`).join('')}</ul></div></section><section class="grid"><div class="panel"><h2>成分動能排行</h2><canvas id="bar"></canvas></div><div class="panel"><h2>訊號類別分布</h2><canvas id="donut"></canvas></div></section><section class="panel" style="margin-top:16px"><h2>健康益處動能</h2><canvas id="line"></canvas></section>`}
function ingredientPage(){let x=sortItems(arr(signals.ingredients),'ingredients',(a,c)=>[a.name,a.momentum_score,status(a.trend_status),arr(a.health_benefits).join('、'),a.verification_status][c]);return `<section class="panel"><h2>功能性成分</h2>${table(['成分','動能','趨勢','健康訴求','驗證狀態','摘要','來源'],x.map(a=>[esc(a.name),score(a.momentum_score),badge(status(a.trend_status)),esc(arr(a.health_benefits).join('、')),badge(a.verification_status),esc(a.summary),urls(a.source_urls)]),'ingredients')}</section>`}
function benefitPage(){let x=sortItems(arr(signals.benefits),'benefits',(a,c)=>[a.name,a.momentum_score,status(a.trend_status),arr(a.related_ingredients).join('、'),a.verification_status][c]);return `<section class="panel"><h2>消費者健康益處</h2>${table(['健康益處','動能','趨勢','相關成分','驗證狀態','摘要','來源'],x.map(a=>[esc(a.name),score(a.momentum_score),badge(status(a.trend_status)),esc(arr(a.related_ingredients).join('、')),badge(a.verification_status),esc(a.summary),urls(a.source_urls)]),'benefits')}</section>`}
function genericPage(key,title,headers,mapper){let x=sortItems(arr(signals[key]),key,(a,c)=>Object.values(a)[c]||'');return `<section class="panel"><h2>${title}</h2>${table(headers,x.map(mapper),key)}</section>`}
function renderCharts(){const ingredients=[...arr(signals.ingredients)].sort((a,b)=>(b.momentum_score||0)-(a.momentum_score||0)).slice(0,10);const benefits=[...arr(signals.benefits)].sort((a,b)=>(b.momentum_score||0)-(a.momentum_score||0)).slice(0,8);const cats=['功能性成分','健康益處','法規','新品','社群','研究','機會'];const vals=[ingredients.length,benefits.length,arr(signals.regulations).length,arr(signals.new_products).length,arr(signals.social_trends).length,arr(signals.research_reports).length,arr(signals.opportunities).length];if(barChart)barChart.destroy();if(donutChart)donutChart.destroy();if(lineChart)lineChart.destroy();barChart=new Chart(document.getElementById('bar'),{type:'bar',data:{labels:ingredients.map(x=>x.name),datasets:[{data:ingredients.map(x=>x.momentum_score||0),backgroundColor:'#4a947b',borderRadius:7}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,max:100}}}});donutChart=new Chart(document.getElementById('donut'),{type:'doughnut',data:{labels:cats,datasets:[{data:vals,backgroundColor:['#357d68','#87bda7','#e7b965','#c96d69','#769dcb','#a98ac1','#d79f59']}]},options:{plugins:{legend:{position:'bottom'}}}});lineChart=new Chart(document.getElementById('line'),{type:'line',data:{labels:benefits.map(x=>x.name),datasets:[{label:'動能分數',data:benefits.map(x=>x.momentum_score||0),borderColor:'#357d68',backgroundColor:'rgba(53,125,104,.18)',fill:true,tension:.3}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100}}}})}
function render(){renderTabs();let h='';if(active==='overview')h=overview();else if(active==='ingredients')h=ingredientPage();else if(active==='benefits')h=benefitPage();else if(active==='regulations')h=genericPage('regulations','監管動態',['主管機關','事件','涉及成分／產品','風險','摘要','來源'],a=>[esc(a.agency||a.organization),esc(a.title||a.name),esc(arr(a.related_ingredients||a.affected_products).join('、')),badge(a.risk_level||a.trend_status),esc(a.summary),urls(a.source_urls)]);else if(active==='new_products')h=genericPage('new_products','新品發布',['品牌','產品','市場','型態','功能／成分','摘要','來源'],a=>[esc(a.brand),esc(a.title||a.name),esc(a.market||arr(a.geography).join('、')),esc(a.product_format||a.format),esc(arr(a.ingredients||a.health_benefits).join('、')),esc(a.summary),urls(a.source_urls)]);else if(active==='social_trends')h=genericPage('social_trends','社群趨勢',['平台／媒體','話題','驗證狀態','動能','摘要','來源'],a=>[esc(arr(a.platforms||a.platform).join('、')),esc(a.title||a.name),badge(a.verification_status),score(a.momentum_score),esc(a.summary),urls(a.source_urls)]);else if(active==='research_reports')h=genericPage('research_reports','研究報告',['機構','報告','發布日期','關鍵發現','來源'],a=>[esc(a.organization||a.publisher),esc(a.title||a.name),esc(a.published_or_found_date),esc(a.summary),urls(a.source_urls)]);else h=genericPage('opportunities','機會缺口',['機會缺口','需求','競品狀況','風險／驗證','摘要','來源'],a=>[esc(a.title||a.name),esc(a.consumer_need||a.demand),esc(a.competitor_landscape),esc(a.risk_or_validation),esc(a.summary),urls(a.source_urls)]);document.getElementById('app').innerHTML=h;attachSort();if(active==='overview')renderCharts();applySearch()}
function applySearch(){let q=document.getElementById('search').value.trim().toLowerCase();document.querySelectorAll('tbody tr').forEach(r=>r.classList.toggle('hidden',q&&!r.innerText.toLowerCase().includes(q)))}
function setHeader(){const m=signals.meta||{};const title=m.report_label||(m.report_type==='weekly'?'每週市場脈動報告':'每日市場快報');const period=m.report_type==='weekly'&&m.report_period?`${m.report_period.start||'未查得'} 至 ${m.report_period.end||'未查得'}`:(m.report_date||'日期未提供');document.getElementById('report-title').textContent=title;document.getElementById('report-period').textContent=period;document.getElementById('report-updated').textContent=m.last_updated_at||m.generated_at||'更新時間未提供';if(m.data_limitations)document.getElementById('footer').textContent=m.data_limitations}
async function load(){try{const r=await fetch('./data/signals.json',{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);signals=await r.json();setHeader();render()}catch(e){document.getElementById('app').innerHTML=`<section class="panel"><h2>無法讀取資料</h2><p>請確認 <code>data/signals.json</code> 存在且為有效 JSON。</p><p>若你是直接雙擊開啟 HTML，請改用 GitHub Pages，或在檔案所在資料夾執行 <code>python -m http.server 8000</code> 後開啟 <code>http://localhost:8000</code>。</p><p class="meta">錯誤：${esc(e.message)}</p></section>`}}
document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark');document.getElementById('search').oninput=applySearch;load();
</script></body></html>
