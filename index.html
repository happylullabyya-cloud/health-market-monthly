<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>每月市場脈動報告</title><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>
:root{--bg:#f5f4ed;--surface:#fff;--ink:#173a32;--muted:#688078;--line:#dbe7e1;--green:#357d68;--green2:#87bda7;--yellow:#e7b965;--berry:#c96d69;--shadow:0 10px 28px rgba(24,57,48,.08)}body.dark{--bg:#14221e;--surface:#20332d;--ink:#eef7f2;--muted:#b9cec4;--line:#385249;--green:#69b695;--green2:#386b58;--yellow:#edc56f;--berry:#e58b86;--shadow:none}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,"Noto Sans TC",Arial}.wrap{max-width:1450px;margin:auto;padding:25px}.head{display:flex;justify-content:space-between;gap:18px;align-items:flex-start}.eyebrow{font-size:12px;letter-spacing:.12em;font-weight:800;color:var(--green)}h1{margin:7px 0;font-size:30px}.meta,.footer{color:var(--muted);font-size:14px;line-height:1.65}.actions{display:flex;gap:8px;flex-wrap:wrap}.search,button{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit}.search{width:240px}button{cursor:pointer}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0 16px}.tab{background:transparent}.tab.active{background:var(--green);color:#fff;border-color:var(--green)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.card,.panel{background:var(--surface);box-shadow:var(--shadow);border-radius:16px}.card{padding:16px}.label{color:var(--muted);font-size:13px}.value{font-size:29px;font-weight:850;margin:5px 0}.sub{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}.panel{padding:18px;overflow:auto}.panel h2{font-size:18px;margin:0 0 13px}.notice{border-left:4px solid var(--yellow);background:color-mix(in srgb,var(--yellow) 14%,transparent);padding:13px 15px;border-radius:9px;line-height:1.65}.notice ul{margin:8px 0 0;padding-left:20px}.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:750;white-space:nowrap}.high{background:#f9d7d5;color:#8b3330}.medium,.pending{background:#faedc9;color:#735000}.low{background:#dfeee7;color:#27614d}.confirmed{background:#dcefe7;color:#28624e}.noise{background:#e7e9e8;color:#53605c}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{white-space:nowrap;cursor:pointer}a{color:var(--green);font-weight:700;text-decoration:none}.empty{color:var(--muted);padding:26px;text-align:center}.hidden{display:none}.footnote{margin-top:13px;color:var(--muted);font-size:12px;line-height:1.6}.footer{margin:22px 0 4px}@media(max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.head{flex-direction:column}.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}.search{width:100%}}@media(max-width:470px){.wrap{padding:16px}.cards{grid-template-columns:1fr}h1{font-size:25px}}
</style></head><body><div class="wrap"><header class="head"><div><div class="eyebrow">MONTHLY MARKET INTELLIGENCE · HEALTH · WEIGHT MANAGEMENT · TEA</div><h1 id="title">每月市場脈動報告</h1><div class="meta"><span id="period">載入中…</span>　｜　最後更新：<span id="updated">載入中…</span></div></div><div class="actions"><input id="search" class="search" placeholder="搜尋目前頁面資料…"><button id="theme">深／淺色</button></div></header><nav id="tabs" class="tabs"></nav><main id="app"><section class="panel">正在讀取 <code>data/signals.json</code>…</section></main><footer id="footer" class="footer">本報告僅使用公開可驗證資料；社群訊號反映公開討論熱度，不代表因果關係、全體消費者行為、市場規模或實際總銷量。</footer></div><script>
const T={overview:'市場總覽',ingredients:'功能性成分',benefits:'健康益處',product_formats:'產品型態',regulations:'監管動態',new_products:'新品／競品',retail_signals:'零售／通路',pricing:'定價策略',social_trends:'社群趨勢',research_reports:'研究報告',supply_chain_risks:'供應鏈風險',opportunities:'機會缺口'};let S={},active='overview',charts=[];const A=x=>Array.isArray(x)?x:[],E=x=>String(x??'未查得').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),N=x=>Number.isFinite(+x)?Math.round(+x):'—',money=x=>Number.isFinite(+x)?new Intl.NumberFormat('zh-TW',{style:'currency',currency:'TWD',maximumFractionDigits:1}).format(+x):'未查得';
function badge(v){let s=String(v||'未查得'),x=s.toLowerCase(),c=x.includes('high')||s.includes('高')?'high':x.includes('medium')||s.includes('中')?'medium':x.includes('pending')||s.includes('待')?'pending':x.includes('confirmed')||s.includes('已確認')?'confirmed':x.includes('noise')||s.includes('雜')?'noise':'low';return `<span class="badge ${c}">${E(s)}</span>`}function links(v){let x=A(v);return x.length?x.map((u,i)=>`<a href="${E(u)}" target="_blank" rel="noopener">來源${x.length>1?i+1:''}</a>`).join('、'):'未查得'}function status(v){return({rising:'上升',stable:'持平',cooling:'降溫',emerging_pending:'新興待驗證',emerging_confirmed:'已確認新興'})[v]||v||'未查得'}
function tabs(){document.getElementById('tabs').innerHTML=Object.entries(T).map(([k,v])=>`<button class="tab ${active===k?'active':''}" data-k="${k}">${v}</button>`).join('');document.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{active=x.dataset.k;render()})}function table(h,r){return r.length?`<table><thead><tr>${h.map(x=>`<th>${x} ↕</th>`).join('')}</tr></thead><tbody>${r.map(x=>`<tr>${x.map(y=>`<td>${y}</td>`).join('')}</tr>`).join('')}</tbody></table>`:'<div class="empty">本月未新增可驗證訊號。</div>'}function panel(title,body,note=''){return `<section class="panel"><h2>${title}</h2>${body}${note?`<div class="footnote">${E(note)}</div>`:''}</section>`}
function overview(){let k=S.kpis||{},sum=S.summary||{},p=S.pricing_analysis||{};return `<section class="cards"><div class="card"><div class="label">監測訊號</div><div class="value">${N(k.total_signals)}</div><div class="sub">本月整合資料</div></div><div class="card"><div class="label">已確認新興</div><div class="value">${N(k.confirmed_emerging_signals)}</div><div class="sub">跨來源驗證</div></div><div class="card"><div class="label">新品／通路</div><div class="value">${N((k.new_products||0)+(k.retail_channel_events||0))}</div><div class="sub">新品與通路事件</div></div><div class="card"><div class="label">法規／食安</div><div class="value">${N((k.regulatory_events||0)+(k.food_safety_events||0))}</div><div class="sub">風險與公告</div></div><div class="card"><div class="label">完成定價比對</div><div class="value">${N(k.priced_competitors||A(p.competitor_pricing).length)}</div><div class="sub">可比化競品</div></div></section>${panel('本月重點',`<div class="notice"><strong>${E(sum.headline||'本月尚無摘要')}</strong><br>${E(sum.month_over_month_assessment||'首次建立基線，無法進行月度比較。')}<ul>${A(sum.key_takeaways).map(x=>`<li>${badge(x.priority)} <strong>${E(x.title)}</strong>：${E(x.why_it_matters)}；建議：${E(x.recommended_action)}（${links(x.source_urls)}）</li>`).join('')}</ul></div>`)}<section class="grid">${panel('成分動能排行','<canvas id="bar"></canvas>')}${panel('訊號類別分布','<canvas id="donut"></canvas>')}</section><section class="grid">${panel('健康益處動能','<canvas id="line"></canvas>')}${panel('定價策略快覽',table(['類別','市場','比較單位','主流價格帶','觀察'],A(p.price_bands).slice(0,5).map(x=>[E(x.category),E(x.market),E(x.comparison_unit),E(x.mainstream_price_range),E(x.observations)])),p.methodology_note||'價格依公開可見資料整理。')}</section>`}
function generic(key,title,heads,map,note=''){return panel(title,table(heads,A(key==='pricing'?S.pricing_analysis?.competitor_pricing:S[key]).map(map)),note)}
function pricing(){let p=S.pricing_analysis||{};let h=panel('競品定價策略比較',table(['品牌／產品','類別／型態','規格','常態價','有效到手價','促銷／折扣','每份','每日','每 100g／ml','通路','定位','推定策略','來源'],A(p.competitor_pricing).map(x=>[E(x.brand)+'／'+E(x.product_name),E(x.product_category)+'／'+E(x.product_format),E(x.package_description),money(x.msrp_or_regular_price),money(x.estimated_effective_price??x.current_selling_price),x.promotion_depth_percent==null?'未查得':`${N(x.promotion_depth_percent)}%`,money(x.price_per_serving),money(x.daily_cost),x.price_per_100g!=null?money(x.price_per_100g):x.price_per_100ml!=null?money(x.price_per_100ml):'未查得',E(x.channel),badge(x.price_positioning),E(x.inferred_pricing_strategy),links(x.source_urls)])),p.methodology_note);h+=`<div class="grid" style="margin-top:16px">${panel('價格帶地圖',table(['類別','市場','比較單位','入門','主流','溢價','觀察'],A(p.price_bands).map(x=>[E(x.category),E(x.market),E(x.comparison_unit),E(x.entry_price_range),E(x.mainstream_price_range),E(x.premium_price_range),E(x.observations)])))}${panel('價格包裝架構（PPA）',table(['類別','情境','入門包','主力包','囤貨包','溢價包','市場觀察'],A(p.price_pack_architecture).map(x=>[E(x.category),E(x.occasion),E(x.entry_pack)+' '+money(x.entry_price_point),E(x.core_pack)+' '+money(x.core_price_point),E(x.stock_up_pack)+' '+money(x.stock_up_price_point),E(x.premium_pack)+' '+money(x.premium_price_point),E(x.price_ladder_observation)])))}</div>`;h+=panel('類別定價意涵',table(['類別','價格地圖','常見模式','過度競爭','潛在空白','溢價驅動','驗證需求'],A(p.category_pricing_implications).map(x=>[E(x.category),E(x.current_price_map),E(x.common_pricing_patterns),E(x.overcrowded_price_points),E(x.potential_white_space),E(A(x.premium_value_drivers).join('、')),E(x.validation_needed)])));h+=panel('定價資料限制','<ul>'+A(p.data_limitations).map(x=>`<li>${E(x)}</li>`).join('')+'</ul>');return h}
function render(){tabs();let h;if(active==='overview')h=overview();else if(active==='ingredients')h=generic('ingredients','功能性成分',['成分','動能','月變化','趨勢','健康訴求','法規提醒','來源'],x=>[E(x.name),N(x.momentum_score),x.monthly_change==null?'未查得':N(x.monthly_change),badge(status(x.trend_status)),E(A(x.health_benefits).join('、')),E(x.regulatory_note),links(x.source_urls)]);else if(active==='benefits')h=generic('benefits','健康益處',['健康益處','動能','月變化','趨勢','成分','情境','來源'],x=>[E(x.name),N(x.momentum_score),x.monthly_change==null?'未查得':N(x.monthly_change),badge(status(x.trend_status)),E(A(x.related_ingredients).join('、')),E(A(x.consumer_contexts).join('、')),links(x.source_urls)]);else if(active==='product_formats')h=generic('product_formats','產品型態與使用情境',['型態／情境','動能','月變化','訴求','代表品牌','競爭程度','來源'],x=>[E(x.name),N(x.momentum_score),x.monthly_change==null?'未查得':N(x.monthly_change),E(A(x.health_benefits).join('、')),E(A(x.representative_brands).join('、')),badge(x.competition_level),links(x.source_urls)]);else if(active==='regulations')h=generic('regulations','監管動態',['機關','事件','類型','涉及成分／產品','風險','建議','來源'],x=>[E(x.agency),E(x.title),E(x.category),E(A(x.related_ingredients).concat(A(x.affected_products)).join('、')),badge(x.risk_level),E(x.recommended_action),links(x.source_urls)]);else if(active==='new_products')h=generic('new_products','新品與競品',['品牌','產品','市場','型態','成分／訴求','價格／規格','通路','來源'],x=>[E(x.brand),E(x.title),E(x.market),E(x.product_format),E(A(x.ingredients).concat(A(x.health_benefits)).join('、')),E(x.price_or_packaging),E(x.retailer_or_channel),links(x.source_urls)]);else if(active==='retail_signals')h=generic('retail_signals','零售／通路',['通路','市場','品類','訊號','價格帶','資料限制','來源'],x=>[E(x.retailer),E(x.market),E(x.category),E(x.title)+'：'+E(x.summary),E(x.price_range),E(x.data_limitation),links(x.source_urls)]);else if(active==='pricing')h=pricing();else if(active==='social_trends')h=generic('social_trends','社群趨勢',['平台','話題','動能','月變化','狀態','來源數','驗證','來源'],x=>[E(A(x.platforms).join('、')),E(x.name),N(x.momentum_score),x.monthly_change==null?'未查得':N(x.monthly_change),badge(status(x.trend_status)),N(x.source_count),badge(x.verification_status),links(x.source_urls)]);else if(active==='research_reports')h=generic('research_reports','研究報告',['機構','報告','類型','日期','摘要','台灣啟示','來源'],x=>[E(x.organization),E(x.title),E(x.category),E(x.published_or_found_date),E(x.summary),E(x.implication_for_taiwan),links(x.source_urls)]);else if(active==='supply_chain_risks')h=generic('supply_chain_risks','供應鏈風險',['風險','類型','等級','影響','建議','來源'],x=>[E(x.name),E(x.category),badge(x.risk_level),E(x.potential_impact),E(x.recommended_action),links(x.source_urls)]);else h=generic('opportunities','市場機會缺口',['機會','需求','競品狀況','產品方向','定價／包裝','風險','來源'],x=>[E(x.title),E(x.consumer_need),E(x.competitor_landscape),E(x.product_direction),E(x.pricing_or_packaging_opportunity),E(x.risk_or_validation),links(x.source_urls)]);document.getElementById('app').innerHTML=h;if(active==='overview')draw();filter()}
function draw(){let ing=[...A(S.ingredients)].sort((a,b)=>(b.momentum_score||0)-(a.momentum_score||0)).slice(0,10),ben=[...A(S.benefits)].sort((a,b)=>(b.momentum_score||0)-(a.momentum_score||0)).slice(0,8),v=[ing.length,ben.length,A(S.product_formats).length,A(S.regulations).length,A(S.new_products).length,A(S.retail_signals).length,A(S.social_trends).length,A(S.opportunities).length];charts.forEach(x=>x.destroy());charts=[];charts.push(new Chart(document.getElementById('bar'),{type:'bar',data:{labels:ing.map(x=>x.name),datasets:[{data:ing.map(x=>x.momentum_score||0),backgroundColor:'#4d9b83',borderRadius:7}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{beginAtZero:true,max:100}}}}));charts.push(new Chart(document.getElementById('donut'),{type:'doughnut',data:{labels:['成分','益處','型態','法規','新品','零售','社群','機會'],datasets:[{data:v,backgroundColor:['#357d68','#87bda7','#e7b965','#c96d69','#769dcb','#a98ac1','#d79f59','#6f9c8a']}]},options:{plugins:{legend:{position:'bottom'}}}}));charts.push(new Chart(document.getElementById('line'),{type:'line',data:{labels:ben.map(x=>x.name),datasets:[{label:'動能',data:ben.map(x=>x.momentum_score||0),borderColor:'#357d68',backgroundColor:'#357d6822',fill:true,tension:.3}]},options:{plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,max:100}}}}))}
function filter(){let q=document.getElementById('search').value.toLowerCase();document.querySelectorAll('tbody tr').forEach(x=>x.classList.toggle('hidden',q&&!x.innerText.toLowerCase().includes(q)))}function head(){let m=S.meta||{},p=m.report_period?`${m.report_period.start||'未查得'} 至 ${m.report_period.end||'未查得'}`:m.report_date||'日期未提供';document.getElementById('title').textContent=m.report_label||'每月市場脈動報告';document.getElementById('period').textContent=p;document.getElementById('updated').textContent=m.last_updated_at||m.generated_at||'未提供';if(m.data_limitations)document.getElementById('footer').textContent=m.data_limitations}async function load(){try{let r=await fetch('./data/signals.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);S=await r.json();head();render()}catch(e){document.getElementById('app').innerHTML=panel('無法讀取資料',`<p>請確認 <code>data/signals.json</code> 存在且為有效 JSON。</p><p>若直接雙擊 HTML，請改用 GitHub Pages 或以 <code>python -m http.server 8000</code> 開啟。</p><p class="meta">${E(e.message)}</p>`)}}document.getElementById('theme').onclick=()=>document.body.classList.toggle('dark');document.getElementById('search').oninput=filter;load();
</script></body></html>
